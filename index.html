<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML Editor</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div id="editable-side">
    <div id="toolbar-wrap">
        <div id="app-tools">
            <button id="projects" onclick="location.hash = '/'">Projects</button>
            <button id="preset-add">+</button>
        </div>
        <div id="toolbar-2">
            <div id="toolbar"></div>
            <div id="tools" style="max-width:600px; flex-wrap:wrap;">
                <button id="tool-cursor">CURSOR</button>
                <button id="tool-info">INFO</button>
                <button style="display:none;" id="tool-select">SELECT</button>
                <button id="tool-transform">TRANSFORM</button>
                <button id="tool-text">TEXT</button>
                <button id="tool-color">COLOR</button>
                <button id="tool-pen">PEN</button>
                <button id="tool-layout">LAYOUT</button>
                <button id="tool-attr">ATTR</button>
            </div>
        </div>
    </div>
    <div id="editor">
        <div id="app"></div>
        <div id="preview"></div>
    </div>
  </div>
  <div id="render-root"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
